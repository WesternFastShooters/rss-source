name: rss-source

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${IMAGE_NAME:-ghcr.io/westernfastshooters/rss-source}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      APP_API_KEY: ${APP_API_KEY:?APP_API_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      RSSHUB_BASE_URL: ${RSSHUB_BASE_URL:?RSSHUB_BASE_URL is required}
      FETCH_ALLOW_PRIVATE_HOSTS: ${FETCH_ALLOW_PRIVATE_HOSTS:?FETCH_ALLOW_PRIVATE_HOSTS is required}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      FETCH_CONCURRENCY: ${FETCH_CONCURRENCY:-6}
      DEFAULT_FETCH_INTERVAL_MINUTES: ${DEFAULT_FETCH_INTERVAL_MINUTES:-30}
      SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-30}
      FETCH_TIMEOUT_MS: ${FETCH_TIMEOUT_MS:-20000}
      FETCH_MAX_BYTES: ${FETCH_MAX_BYTES:-10485760}
      AUTO_MIGRATE: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
      rsshub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 0.75
    logging: *default-logging
    networks:
      - backend

  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    volumes:
      - /srv/data/rss-source/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 0.75
    logging: *default-logging
    networks:
      - backend

  redis:
    image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - /srv/data/rss-source/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.25
    logging: *default-logging
    networks:
      - backend

  rsshub:
    image: ghcr.io/diygod/rsshub:latest@sha256:4baac06c36580f5289808f879033a6a44fdac031629e6e65156dbfad5abb2bc6
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 0.75
    logging: *default-logging
    networks:
      - backend

networks:
  backend:
    driver: bridge
